[build-system]
build-backend = "pdm.backend"
requires = ["pdm-backend"]

[project]
authors = [
    {name = "Cujoko", email = "cujoko@gmail.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "cjk-commons>=3.6.3,<4.0.0",
    "commons-1c>=3.6.3,<4.0.0",
    "loguru>=0.6.0",
    "questionary>=2.1.1",
]
description = "Parse and build utilities for 1C:Enterprise"
dynamic = ["version"]
keywords = ["1c", "parse", "build", "v8reader", "v8unpack", "gcomp"]
license = {text = "MIT"}
name = "parse-1c-build"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
p1cb = "parse_1c_build.__main__:run"

[project.urls]
repository = "https://github.com/cujoko-dev/parse-1c-build"

[tool.pdm.version]
path = "src/parse_1c_build/_version.py"
pattern = '^__version__\s*=\s*"([^"]+)"'
source = "file"
