[package]
name = "p1cb_native"
version = "0.1.0"
edition = "2021"
description = "Optional Rust/PyO3 acceleration for parse-1c-build CF layout"
license = "MIT"
publish = false

[lib]
name = "p1cb_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
regex = "1"
rayon = "1"
once_cell = "1"

[profile.release]
lto = true
codegen-units = 1
